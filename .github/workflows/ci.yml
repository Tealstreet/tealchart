# Mirror CI for tealchart. Source-of-truth lives in the monorepo at
# mirrors/tealchart/.github/workflows/ — contributors cannot edit it here
# (CODEOWNERS + branch protection). Read-only token, no secrets, no release.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: # manual re-run (e.g. validation after a sync)

# Read-only GITHUB_TOKEN — this CI can never push, tag, or release.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
      # puppeteer is a devDependency of the product-path corpus script, which CI
      # never runs — install its types without pulling a browser down.
      - run: yarn install --frozen-lockfile --network-timeout 600000
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: yarn typecheck
      - run: yarn lint
      - name: Prepare pinned native oracle fixtures
        working-directory: packages/tealscript
        run: |
          node scripts/oracle-fixtures.mjs guard
          node --test scripts/oracle-fixtures.test.mjs
          node scripts/oracle-fixtures.mjs fetch
      - run: yarn test
      # Moved here from the monorepo's CI on 2026-10-16: tealchart and tealscript
      # are gated ONLY on this mirror now; the monorepo ignores their paths.
      - run: yarn workspace @tealstreet/tealchart typecheck:native
      # Thresholds were calibrated on the self-hosted box; ubuntu-latest runs
      # ~3-6% over two compile-ms limits. Visible but non-blocking until Sam
      # recalibrates or picks a runner (do not raise thresholds here).
      - name: Test scoped TealScript performance thresholds
        continue-on-error: true
        working-directory: packages/tealscript
        env:
          TEALSCRIPT_PERF_ASSERT: '1'
          TEALSCRIPT_PERF_LOG: '1'
        run: |
          mapfile -d '' perf_files < <(git -C ../.. grep -lz 'TEALSCRIPT_PERF_ASSERT' -- 'packages/tealscript/**/*.test.ts')
          test "${#perf_files[@]}" -gt 0
          yarn vitest run --no-file-parallelism --maxWorkers=1 "${perf_files[@]#packages/tealscript/}"
      - name: Test TealScript opt-in semantic sweeps
        working-directory: packages/tealscript
        run: |
          TEALSCRIPT_ARITY_SWEEP=1 yarn vitest run src/semantic/array-from-arity-reference-contracts.test.ts tests/compat/pine-ledger-gaps-13-arity.test.ts
          TEALSCRIPT_GRAMMAR_DIFF_SOAK=1 yarn vitest run tests/compat/pine-grammar-coverage.test.ts
          TEALSCRIPT_REALTIME_SWEEP=1 yarn vitest run tests/compat/pine-external-corpus-classifier.test.ts tests/compat/pine-composite-indicators.test.ts tests/compat/pine-composite-performance.test.ts tests/strategy-parity/strategy-parity.test.ts
